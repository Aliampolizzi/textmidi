[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "textmidi"
version = "0.1.0"
description = "Write music as plain text and get a multi-track MIDI file for a DAW."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["mido>=1.3"]

[project.urls]
Repository = "https://github.com/Aliampolizzi/textmidi"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
textmidi = "textmidi.__main__:main"

[tool.setuptools]
packages = ["textmidi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
